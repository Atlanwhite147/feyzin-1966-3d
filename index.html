<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feyzin 1966 · expérience 3D</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#e9e4d9;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
  #root{height:100%}
  canvas{display:block;touch-action:none}
  .charge{display:grid;place-items:center;height:100%;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#948d83}
</style>
</head>
<body>
<div id="root"><div class="charge">chargement du site</div></div>
<script>
  /* filet de sécurité : toute erreur devient visible et lisible */
  window.__err = null;
  window.addEventListener("error", (e) => {
    window.__err = (e.message || "erreur") + " · " + (e.filename || "") + ":" + (e.lineno || 0);
    const d = document.createElement("pre");
    d.textContent = "ERREUR : " + window.__err;
    d.style.cssText = "position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#7a1d10;color:#fff;font:12px monospace;z-index:99999;white-space:pre-wrap";
    document.body.appendChild(d);
  });
  window.addEventListener("unhandledrejection", (e) => {
    window.__err = "promesse rejetée · " + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
</script>
<script type="module" src="/public/app.js?v=mwkhrw02"></script>
</body>
</html>
